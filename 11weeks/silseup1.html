<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>반복문을 사용한 홀수합, 짝수합, 총합</title>
</head>
<body>
    <script>
        let oddSum = 0;
        let evenSum = 0;
        let totalSum = 0;

        for (let i = 0; i <= 100; i++) {
            totalSum += i;
            if (i % 2 === 0) {
                evenSum += i;
            } else {
                oddSum += i;
            }
        }

        // document.writeln()을 이용하면 한 칸 띄어쓰기로 출력됨 (첫 번째 결과창 형태)
        document.writeln(totalSum);
        document.writeln(evenSum);
        document.writeln(oddSum);
        
        document.write("<br><br>");
        
        // <br> 태그를 사용하여 줄바꿈 출력 (두 번째 결과창 형태)
        document.write(totalSum + "<br>");
        document.write(evenSum + "<br>");
        document.write(oddSum + "<br>");
    </script>
</body>
</html>
