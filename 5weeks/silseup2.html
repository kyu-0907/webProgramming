<html>

<head>
    <meta charset="UTF-8">
    <title>텍스트 꾸미기</title>
    <style>
        h3 {
            color: black;
        }

        p {
            background: aliceblue;
            color: brown;
        }

        span {
            text-indent: 1em;
            background: aliceblue;
            color: brown;
            font-family: "Lucida Console", Sans- Serif;
            font-size: 20px;
            text-decoration: underline;
        }
    </style>
</head>

<body>
    <h3>텍스트와 폰트</h3>
    <hr>
    <p>AliceBlue 바탕색에 Brown 색의 "Lucida<br>
        Console" 폰트로 10px 크기이고
        <span>저는 이보<br>다 1.5배 큽니
            다.</span>
    </p>
</body>

</html>
