<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>:hover 활용</title>
    <style>
        #img {
            width: 100px;
            height: 140px;
            /* 아래 url() 안에 실제 카드 뒷면 이미지 파일의 이름을 적어주세요 */
            background-image: url("back.png"); 
            background-size: 100px 140px;
        }

        #img:hover {
            /* 아래 url() 안에 실제 카드 앞면 파일(예: 7스페이드)의 이름을 적어주세요 */
            background-image: url("front.png"); 
        }
    </style>
</head>
<body>
    <h3>:hover 활용</h3>
    <hr>
    <table>
        <tr>
            <td>마우스를 올리면 카드의 앞면이 보인다.</td>
            <td><div id="img"></div></td>
        </tr>
    </table>
</body>
</html>
