<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS3 Font Property</title>
    <style>
        .font_big {
            font-size: 2em;
        }

        .font_italic {
            font-style: italic;
        }

        .font_bold {
            font-weight: bold;
        }

        .font_center {
            text-align: center;
        }

        .button {
            display: inline-block;
            width: 150px;
            height: 70px;
            background-color: #FF6A00;
            border: 10px solid #FFFFFF;
            border-radius: 30px;
            box-shadow: 5px 5px 5px #A9A9A9;
            margin: 10px;
        }

        .button>a {
            display: block;
            line-height: 70px;
            text-decoration: none;
        }
    </style>
</head>

<body>
    <div class="button">
        <a href="#" class="font_big font_italic font_bold font_center">click 1</a>
    </div>
    <div class="button">
        <a href="#" class="font_big font_italic font_bold font_center">click 2</a>
    </div>
    <div class="button">
        <a href="#" class="font_big font_italic font_bold font_center">click 3</a>
    </div>

    



</body>

</html>
