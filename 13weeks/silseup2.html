<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<script src="https://code.jquery.com/jquery-3.6.4.js"></script>
<script>
    $(document).ready(function () {
        // 스타일을 적용합니다.
        $('.box').css('float', 'left');
        $('.box').css('margin', 10);
        $('.box').css('width', 100);
        $('.box').css('height', 100);
        $('.box').css('backgroundColor'
            , 'red');
    });
</script>
<script>
    $(document).ready(function () {
        // 스타일을 적용합니다.
        $('.box').css({
            float: 'left',
            margin: 10,
            width: 100,
            height: 100,
            backgroundColor: 'red'
        });
    });
</script>

<body>
    <div class="box"></div>
    <div class="box"></div>
    <div class="box"></div>
</body>

</html>
