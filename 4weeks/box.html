<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>버튼 만들기</title>
    <style>
        .box {
            border: 1px solid #000;
            padding: 20px;
            width: 250px;
        }
        h2 {
            margin-top: 0;
            margin-bottom: 15px;
        }
        hr {
            border: 0;
            border-top: 1px solid #aaa;
            margin-bottom: 15px;
        }
        .keypad button {
            width: 35px;
            height: 35px;
            margin-right: 5px;
            margin-bottom: 5px;
            font-size: 16px;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="box">
        <h2>버튼을 만들자</h2>
        <hr>
        <div class="keypad">
            <button>1</button>
            <button>2</button>
            <button>3</button>
            <br>
            <button>4</button>
            <button>5</button>
            <button>6</button>
            <br>
            <button>7</button>
            <button>8</button>
            <button>0</button>
        </div>
    </div>

</body>
</html>
