<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>글 작성하기</title>
</head>

<body>
    <p><strong>글 작성하기</strong></p>
    <form action="#">
        <div>
            <label>작성자 <input type="text" name="author"></label>
        </div>
        <br>
        <div>
            <label>아이디 <input type="text" name="userid"></label>
        </div>
        <br>
        <div>
            <label>이메일 <input type="text" name="email_id"> @ <input type="text" name="email_domain"></label>
        </div>
        <br>
        <div>
            <label>휴대폰
                <select name="phone1">
                    <option value="010">010</option>
                    <option value="011">011</option>
                    <option value="016">016</option>
                    <option value="017">017</option>
                    <option value="018">018</option>
                    <option value="019">019</option>
                </select>
                - <input type="text" name="phone2" size="4" maxlength="4">
                - <input type="text" name="phone3" size="4" maxlength="4">
            </label>
        </div>
        <br>
        <div>
            <label>글제목 <input type="text" name="title" size="40"></label>
        </div>
        <br>
        <div>
            <label for="content">내용</label><br>
            <textarea id="content" name="content" rows="10" cols="50"></textarea>
        </div>
        <br>
        <button type="submit">제출</button>
    </form>
</body>

</html>
