<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <p><strong>시작 그룹</strong></p>
    <label>
        <input type="radio" name="startup" value="new-tab" checked>
        새 탭 페이지 열기
    </label><br>
    <label>
        <input type="radio" name="startup" value="continue">
        중단한 위치에서 계속하기
    </label><br>
    <label>
        <input type="radio" name="startup" value="specific-pages">
        특정 페이지 또는 페이지 모음 열기
    </label>

    <br><br>

    <p><strong>개인정보 및 보안</strong></p>
    <label>
        <input type="checkbox" name="privacy" value="sync">
        동기화 및 서비스
    </label><br>
    <label>
        <input type="checkbox" name="privacy" value="login-allow">
        로그인 허용
    </label><br>
    <label>
        <input type="checkbox" name="privacy" value="preload">
        페이지 미리 로드
    </label>
</body>

</html>
